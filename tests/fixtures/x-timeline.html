<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Mock X home</title>
    <style>
      body {
        margin: 0;
        font: 16px system-ui;
      }
      main {
        max-width: 600px;
        margin-inline: auto;
      }
      [role="tablist"] {
        display: flex;
        gap: 1rem;
        padding: 10px;
      }
      [data-testid="cellInnerDiv"] {
        min-height: 125px;
        border-bottom: 1px solid grey;
      }
      article {
        padding: 12px;
      }
      [data-testid="tweetText"] {
        white-space: pre-wrap;
      }
      aside {
        position: absolute;
        right: 0;
        top: 0;
      }
    </style>
  </head>
  <body>
    <main data-testid="primaryColumn">
      <nav role="tablist" aria-label="Home timeline">
        <button type="button" role="tab" aria-selected="true">For you</button>
        <button type="button" role="tab" aria-selected="false">
          Following
        </button>
        <button type="button" role="tab" aria-selected="false">
          Custom list
        </button>
      </nav>
      <section aria-labelledby="accessible-list-0">
        <h1 id="accessible-list-0" hidden>Timeline: Your Home Timeline</h1>
        <div id="timeline" aria-label="Timeline: Your Home Timeline"></div>
      </section>
    </main>
    <aside>This sidebar is outside the timeline.</aside>
  </body>
</html>
